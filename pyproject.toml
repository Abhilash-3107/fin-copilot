[build-system]
# 1.27+ implements PEP 639 (SPDX license expression + bundled license files).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finance-copilot"
version = "0.1.2"
description = "Local-first personal finance tool: parses bank statement PDFs and auto-categorizes transactions with rules, RAG, and a local LLM."
readme = "README.md"
# Source-available: free to use, self-host, modify and contribute to, but not
# to resell as a competing product. Each release becomes MIT two years after
# it ships. 0.1.0 and 0.1.1 were published under MIT.
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["finance", "personal-finance", "bank-statements", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial",
]
# Upper bounds sit below the next major of stable (>=1.0) dependencies, plus
# below 1.0 for typer and httpx, mature 0.x libraries where 1.0 is the natural
# point for breaking changes. uvx resolves
# fresh and ignores uv.lock, so an uncapped major would break new installs the
# day it ships. 0.x deps stay uncapped; the CI python-compat fresh-resolve
# matrix catches breakage there. cryptography majors arrive almost every
# release and only touch PDF decryption, so it is left uncapped too.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pdfplumber>=0.11",
    "cryptography>=43",        # password-protected statement PDFs (AES)
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "sqlite-vec>=0.1.6",
    "python-ulid>=2.6",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9", # FastAPI multipart uploads (statement PDFs)
    "platformdirs>=4,<5",        # per-OS app-data directory for the packaged app
    # In-process embeddings (RAG with zero setup). Deliberately a hard dependency:
    # the whole point of phase 2 is that a fresh install has working retrieval
    # without Ollama, an API key, or any decision.
    # Except on Pythons onnxruntime publishes no wheels for yet (3.15 as of
    # 2026-11): uvx picks the newest Python on the machine and requires-python
    # cannot steer it, so a hard dependency would make the app uninstallable
    # there. Without fastembed the app runs with built-in embeddings off.
    # Raise the bound once onnxruntime ships wheels for the next version.
    "fastembed>=0.4; python_version < '3.15'",
]

[project.optional-dependencies]
# Fully-local LLM (Settings > AI & Model > "On this computer"). Never a hard
# dependency: llama-cpp-python wheels are large and platform-fussy, and most
# users are fine with rules + RAG or a BYOM key.
local-llm = ["llama-cpp-python>=0.3"]

[project.scripts]
finance-copilot = "finance_copilot.app:main"

[project.urls]
Homepage = "https://github.com/Abhilash-3107/fin-copilot"
Source = "https://github.com/Abhilash-3107/fin-copilot"
Changelog = "https://github.com/Abhilash-3107/fin-copilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/Abhilash-3107/fin-copilot/issues"

[dependency-groups]
# httpx2: starlette.testclient deprecated plain httpx in favour of this fork
# (3.11+ only; 3.10 falls back to httpx with a deprecation warning).
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2.16; python_version >= '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["finance_copilot"]
# Tests (and their PDF fixtures) stay out of the shipped wheel; CI runs them
# from a checkout copy against the installed wheel instead.
exclude = ["finance_copilot/tests"]

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py bundles the built SPA (ui/dist) into real wheels as
# finance_copilot/ui_dist; main.py serves it from there and falls back to the
# repo's ui/dist in a dev checkout. Editable installs (uv sync) skip it, so a
# fresh clone installs without building the UI first.

[tool.hatch.build.targets.sdist]
# The sdist is a source snapshot for `pip install` from source; it needs the
# built UI too because most installers won't have Node.
# Leading slashes anchor to the project root; a bare "README.md" is a
# gitignore-style pattern that also pulled in deploy/demo/README.md.
include = [
    "/finance_copilot",
    "/ui/dist",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/hatch_build.py",
]
exclude = ["/finance_copilot/tests"]
# ui/dist is gitignored (it is a build output), so it must be declared an
# artifact or hatchling's VCS-ignore filter drops it from the sdist.
artifacts = ["ui/dist"]

[tool.pytest.ini_options]
testpaths = ["finance_copilot/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # E501 (line length) is enforced by the formatter, not the linter, to avoid
    # fighting over long SQL strings and comments.
    "E501",
    # B008: FastAPI's Depends()/Query() in argument defaults is the framework's
    # documented, correct pattern - not the mutable-default footgun B008 targets.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# main.py deliberately runs logging.basicConfig before importing route modules
# so their import-time loggers inherit the format; that's an intentional E402.
"finance_copilot/main.py" = ["E402"]
# Standalone scripts insert the repo root on sys.path before importing finance_copilot.*.
"scripts/*.py" = ["E402"]
