name: Release

# Tag vX.Y.Z → build the UI + wheel, test against the *installed* wheel (which
# catches missing package data), smoke-test the real user command on all three
# OSes, then publish to PyPI via trusted publishing (no long-lived tokens).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build wheel (UI bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: uv build

      - name: Test against the installed wheel
        # Tests run from a copy outside the checkout so `import finance_copilot`
        # resolves to the installed wheel, not the repo directory.
        run: |
          uv venv wheel-test-env
          uv pip install --python wheel-test-env/bin/python dist/*.whl pytest
          cp -r finance_copilot/tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/wheel-test-env/bin/python" -m pytest wheel-tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run the real user command and exercise the API
        shell: bash
        env:
          FC_DATA_DIR: ${{ runner.temp }}/fc-data
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          uvx --from "$WHEEL" finance-copilot --no-browser --port 8975 &
          SERVER_PID=$!

          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8975/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8975/api/health

          # Upload a fixture statement and assert transactions parsed.
          curl -sf -F "file=@finance_copilot/tests/fixtures/sample_statement.pdf" \
            http://127.0.0.1:8975/api/statements/upload
          COUNT=$(curl -sf http://127.0.0.1:8975/api/transactions | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "parsed transactions: $COUNT"
          test "$COUNT" -gt 0

          # The DB must land in the app-data dir, and shutdown must be clean.
          test -f "$FC_DATA_DIR/finance.db"
          kill "$SERVER_PID"
          wait "$SERVER_PID" || true

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
