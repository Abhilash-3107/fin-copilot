name: Release

# Tag vX.Y.Z → build the UI + wheel, test against the *installed* wheel (which
# catches missing package data), smoke-test the real user command on all three
# OSes, run the browser journeys against the wheel, open a ledger made by the
# previous release with the new wheel (J15), then publish to PyPI via trusted
# publishing (no long-lived tokens).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build wheel (UI bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the package version
        # A mismatch would either fail late at upload (version already on
        # PyPI) or publish a release whose version disagrees with its tag.
        run: |
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: uv build

      - name: Test against the installed wheel
        # Tests run from a copy outside the checkout so `import finance_copilot`
        # resolves to the installed wheel, not the repo directory.
        run: |
          uv venv wheel-test-env
          uv pip install --python wheel-test-env/bin/python dist/*.whl pytest
          cp -r finance_copilot/tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/wheel-test-env/bin/python" -m pytest wheel-tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run the real user command and exercise the API
        shell: bash
        env:
          FC_DATA_DIR: ${{ runner.temp }}/fc-data
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          uvx --from "$WHEEL" finance-copilot --no-browser --port 8975 &
          SERVER_PID=$!

          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8975/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8975/api/health

          # Upload a fixture statement and assert transactions parsed.
          curl -sf -F "file=@finance_copilot/tests/fixtures/sample_statement.pdf" \
            http://127.0.0.1:8975/api/statements/upload
          COUNT=$(curl -sf http://127.0.0.1:8975/api/transactions | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "parsed transactions: $COUNT"
          test "$COUNT" -gt 0

          # The DB must land in the app-data dir, and shutdown must be clean.
          test -f "$FC_DATA_DIR/finance.db"
          kill "$SERVER_PID"
          wait "$SERVER_PID" || true

  e2e:
    name: End to end (Playwright, built wheel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the journeys against the built wheel
        working-directory: e2e
        env:
          FC_E2E_SERVER: wheel
          FC_E2E_WHEEL: ${{ github.workspace }}/dist
        run: npm test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  upgrade:
    # J15: a ledger made by the previous published release (installed from PyPI,
    # as a user runs it) opens in this wheel. Stored facts must be identical and
    # a figure may differ only if e2e/upgrade/expected-changes.json lists it.
    # It needs PyPI, so it runs here and not on every push.
    name: Upgrade from the previous release (J15)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install the journeys' dependencies
        working-directory: e2e
        run: npm ci

      - name: Open the previous release's ledger in the new wheel
        working-directory: e2e
        env:
          FC_E2E_WHEEL: ${{ github.workspace }}/dist
        run: npm run upgrade

      - name: Keep the snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-report
          path: e2e/test-results/upgrade

  publish:
    name: Publish to PyPI
    needs: [build, smoke, e2e, upgrade]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
