name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check finance_copilot/

      - name: Run tests
        run: uv run pytest

  python-compat:
    # `uvx finance-copilot` runs on whatever Python is newest on the user's
    # machine, and requires-python cannot steer that choice. Resolve and test
    # fresh (no lockfile, like uvx does) on every supported version plus the
    # newest one, so a dependency without wheels for it fails here, not on a tag.
    name: Python ${{ matrix.python }} (fresh resolve)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install the package and pytest
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e . pytest

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
